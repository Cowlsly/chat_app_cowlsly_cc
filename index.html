<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15131a" />
  <meta name="description" content="Cowlsly private chat basic testing build." />
  <title>Cowlsly Chat</title>
</head>
<body>
  <main class="chat-shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo">C</span><div><strong>Cowlsly</strong><small>Private chat demo</small></div></div>
      <button id="new-chat">+ New demo chat</button>
      <div id="conversation-list" class="conversation-list"></div>
      <button id="reset-demo" class="secondary">Reset demo</button>
    </aside>

    <section class="chat-panel">
      <header class="chat-header">
        <div><p class="eyebrow">Local test conversation</p><h1 id="chat-title">Welcome to Cowlsly Chat</h1></div>
        <span class="status-dot">Demo only</span>
      </header>
      <div id="message-list" class="message-list" aria-live="polite"></div>
      <form id="message-form" class="composer">
        <label class="sr-only" for="message-input">Message</label>
        <textarea id="message-input" name="message" maxlength="500" placeholder="Write a respectful message…" required></textarea>
        <button type="submit">Send</button>
      </form>
      <p class="safety">Messages stay in this browser. Do not enter real private information during testing.</p>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
