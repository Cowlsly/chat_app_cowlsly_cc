name: Automatic Build

on:
  push:
    branches: [root]
  pull_request:
    branches: [root]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then echo "python=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f pom.xml ]; then echo "maven=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f gradlew ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then echo "gradle=true" >> "$GITHUB_OUTPUT"; fi
          if compgen -G '*.sln' > /dev/null || compgen -G '*.csproj' > /dev/null; then echo "dotnet=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f Dockerfile ]; then echo "docker=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            yarn.lock
            pnpm-lock.yaml

      - name: Build Node.js project
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test --if-present
          npm run lint --if-present
          npm run build --if-present

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build Python project
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then python -m build; fi
          if command -v pytest >/dev/null 2>&1; then pytest -q; fi

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build Go project
        if: steps.detect.outputs.go == 'true'
        run: |
          go test ./...
          go build ./...

      - name: Set up Java
        if: steps.detect.outputs.maven == 'true' || steps.detect.outputs.gradle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ steps.detect.outputs.maven == 'true' && 'maven' || 'gradle' }}

      - name: Build Maven project
        if: steps.detect.outputs.maven == 'true'
        run: mvn --batch-mode verify

      - name: Build Gradle project
        if: steps.detect.outputs.gradle == 'true'
        shell: bash
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew build; else gradle build; fi

      - name: Set up .NET
        if: steps.detect.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET project
        if: steps.detect.outputs.dotnet == 'true'
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release

      - name: Validate Docker image
        if: steps.detect.outputs.docker == 'true'
        run: docker build --tag repository-build:${{ github.sha }} .

      - name: Confirm repository is buildable
        shell: bash
        run: |
          if [ "${{ steps.detect.outputs.node }}${{ steps.detect.outputs.python }}${{ steps.detect.outputs.go }}${{ steps.detect.outputs.maven }}${{ steps.detect.outputs.gradle }}${{ steps.detect[...]
            echo "No supported build manifest detected; repository checkout succeeded."
          fi
