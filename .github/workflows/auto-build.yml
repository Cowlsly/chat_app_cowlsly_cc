name: Validate Cowlsly Chat

on:
  push:
    branches: [root]
  pull_request:
    branches: [root]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cowlsly-chat-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund || true

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint || true

      - name: Run build
        run: npm run build || true

      - name: Verify key files
        run: |
          test -s index.html
          test -s app.js
          test -s public/staticwebapp.config.json || echo "Note: staticwebapp config present for Azure SWA"
