name: Validate Cowlsly Chat

on:
  push:
    branches: [root]
  pull_request:
    branches: [root]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cowlsly-chat-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run source checks
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/staticwebapp.config.json
          find dist -maxdepth 3 -type f -print
