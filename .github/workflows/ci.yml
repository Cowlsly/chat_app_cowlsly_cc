name: CI

on:
  push:
    branches: [root]
  pull_request:
    branches: [root]

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (if needed)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts; fi

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Secret scan (basic)
        run: |
          # Lightweight check for common secret patterns
          if grep -rE '(api[_-]?key|secret|password|token)\s*[:=]\s*["\'][a-zA-Z0-9]{20,}' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "Potential secrets detected"; exit 1;
          else
            echo "No obvious secrets found.";
          fi
